name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble Android project from repo files
        run: |
          D=app/src/main/java/com/not/voiceagent
          mkdir -p $D
          cp Actions.kt MainActivity.kt $D/
          cp AndroidManifest.xml app/src/main/
          echo "android.useAndroidX=true" > gradle.properties

          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoiceAgent"
          include(":app")
          EOT

          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT

          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.not.voiceagent"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.not.voiceagent"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  buildConfigField("String", "BACKEND_URL", "\"https://agaent.onrender.com\"")
                  buildConfigField("String", "APP_TOKEN", "\"" + (System.getenv("APP_TOKEN") ?: "") + "\"")
              }
              buildFeatures { buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOT

          cat > $D/Brain.kt <<'EOT'
          package com.not.voiceagent

          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          data class AgentAction(val action: String, val args: JSONObject, val reply: String)

          object Brain {
              private val client = OkHttpClient.Builder().readTimeout(60, TimeUnit.SECONDS).build()

              fun think(command: String): AgentAction {
                  val body = JSONObject().put("command", command)
                  val req = Request.Builder().url(BuildConfig.BACKEND_URL + "/think")
                      .header("x-app-token", BuildConfig.APP_TOKEN)
                      .post(body.toString().toRequestBody("application/json".toMediaType())).build()
                  client.newCall(req).execute().use { r ->
                      val j = JSONObject(r.body!!.string())
                      if (j.has("error")) throw Exception(j.getString("error"))
                      return AgentAction(j.optString("action", "none"), j.optJSONObject("args") ?: JSONObject(), j.optString("reply"))
                  }
              }
          }
          EOT

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voice-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
